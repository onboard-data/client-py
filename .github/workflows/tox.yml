name: onboard.client
on:
  push:
    branches: dev
  pull_request:
jobs:
  tox:
    runs-on: [ubuntu-22.04]
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install tox
        run: pip install tox
      - name: Stylecheck (flake8)
        run: tox -e flake8
      - name: Test (pytest)
        run: tox -e py3
      - name: Typecheck (mypy)
        run: tox -e mypy
